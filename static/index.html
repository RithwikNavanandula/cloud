  <script>
    (() => {
      const syncRouteClass = () => {
        document.body.classList.toggle('route-live', window.location.pathname === '/live');
      };
      ['pushState', 'replaceState'].forEach((name) => {
        const original = history[name];
        history[name] = function (...args) {
          const result = original.apply(this, args);
          queueMicrotask(syncRouteClass);
          return result;
        };
      });
      window.addEventListener('popstate', syncRouteClass);
      document.addEventListener('DOMContentLoaded', syncRouteClass);
    })();
  </script>
